name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The fast tests need no PyTorch; tests/test_models.py skips itself without ultralytics.
      - run: pip install pytest numpy opencv-python-headless
      - run: pytest -q
